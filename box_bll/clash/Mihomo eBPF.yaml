# ============ 路由规则 ============
# 规则优先级：从上到下依次匹配，命中即停止
rules:
  # -------- DNS 相关规则 --------
  - DST-PORT,53,🌐 DNS_Hijack # 将发自 53 端口的 DNS 请求送进 DNS 模块而不是作为链接显示
  # -------- 自定义规则优先 --------
  - RULE-SET,直连名单,国内直连名单
  - RULE-SET,代理名单,海外代理名单
  #- PROCESS-NAME,sub_store_node,订阅更新

  # -------- 功能性拦截规则 --------
  - RULE-SET,WebRTC_端/域,WebRTC
  - DST-PORT,3478/5349-5350/10000/19302,WebRTC
  - RULE-SET,No-ads-all_域,广告拦截
  - RULE-SET,Category-DoH,广告拦截
  - RULE-SET,HTTPDNS-CN,广告拦截
  - DOMAIN-KEYWORD,v6.gh-proxy,DIRECT
  - DOMAIN-SUFFIX,pool.ntp.org,DIRECT
  - DOMAIN,time.is,DIRECT

  # -------- 独立/特定分流规则 --------
  # --- PikPak--
  - DOMAIN,access.pikpakdrive.com,REJECT
  - DOMAIN,access.mypikpak.com,REJECT
  - DOMAIN,access.mypikpak.net,REJECT
  - DOMAIN,access.pikpak.me,REJECT
  - DOMAIN-KEYWORD,dl-a10b-,DIRECT
  - DOMAIN-KEYWORD,dl-z01a-,DIRECT
  - DOMAIN-REGEX,^dl-[A-Za-z0-9-]+\.mypikpak\.com$,DIRECT

  # --- BT/PT 下载分流---
  - DOMAIN-KEYWORD,ipv6tracker,Tracker
  - DOMAIN-KEYWORD,bittorrent,Tracker
  - DOMAIN-KEYWORD,torrent,Tracker
  - DOMAIN-KEYWORD,tracker,Tracker
  - RULE-SET,PublicTracker,Tracker
  - RULE-SET,Trackers,Tracker
  - RULE-SET,Xunlei,Tracker

  # --- 极致优化：游戏下载 CDN 及国区平台强制直连 ---
  - DOMAIN-KEYWORD,steamcontent,DIRECT
  - DOMAIN-KEYWORD,origin-a,DIRECT
  - RULE-SET,GameDownload,DIRECT
  - RULE-SET,Blizzard,DIRECT
  - RULE-SET,Ubisoft,DIRECT
  - RULE-SET,GamesCN,DIRECT
  - RULE-SET,PlayStation,Steam
  - RULE-SET,Nintendo,Steam
  - RULE-SET,Origin,Steam
  - RULE-SET,Xbox,Steam
  - RULE-SET,Epic,Steam
  - RULE-SET,GOG,Steam
  - RULE-SET,EA,Steam
  - RULE-SET,GamesGlobal,Steam

  # --- Copilot & 必应---
  - DOMAIN-SUFFIX,copilot.microsoft.com,AI
  - DOMAIN-SUFFIX,api.microsoftapp.net,AI
  - DOMAIN-SUFFIX,copilot.azure.com,AI
  - DOMAIN-SUFFIX,openai.azure.com,AI
  - DOMAIN,edgeservices.bing.com,AI
  - DOMAIN,sydney.bing.com,AI
  - DOMAIN,img.bing.com,AI
  - RULE-SET,Bing,Microsoft
  - RULE-SET,MSN,Microsoft

  # -------- 本地网络规则 --------
  - RULE-SET,Private_域,DIRECT
  - RULE-SET,Private_IP,DIRECT,no-resolve   # 该 ipcidr 规则集含 IPv6 私有段，双栈下同样生效

  # -------- 主配置原生应用分流规则 --------
  - PROCESS-NAME,com.ss.android.ugc.aweme.lite,DIRECT
  - PROCESS-NAME,com.ss.android.ugc.aweme,DIRECT
  - RULE-SET,DouYin_域,DIRECT

  - PROCESS-NAME,com.xingin.xhs,DIRECT
  - RULE-SET,XiaoHongShu_域,DIRECT

  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - RULE-SET,Steam_域,Steam
  - RULE-SET,GitHub_域,GitHub
  - RULE-SET,E-hentai_域,E-hentai
  - RULE-SET,Pixiv_域,Pixiv
  - RULE-SET,TikTok_域,TikTok

  - RULE-SET,Twitter_域,Twitter(X)
  - RULE-SET,Twitter_IP,Twitter(X),no-resolve

  - RULE-SET,AI_域,AI
  - RULE-SET,AI_IP,AI,no-resolve
  - PROCESS-NAME,com.openai.chatgpt,AI

  - RULE-SET,FCM_域,GoogleFCM
  - RULE-SET,FCM_IP,GoogleFCM,no-resolve

  - RULE-SET,YouTube_域,YouTube
  - RULE-SET,YouTube_IP,YouTube,no-resolve

  - RULE-SET,Google_域,Google
  - RULE-SET,Google_IP,Google,no-resolve

  - RULE-SET,Microsoft_域,Microsoft

  - RULE-SET,Telegram_域,Telegram
  - RULE-SET,Telegram_IP,Telegram,no-resolve

  # -------- 中国大陆全局兜底 --------
  - RULE-SET,CN_域,DIRECT
  - RULE-SET,CN_IP,DIRECT,no-resolve

  # -------- Cloudflare（放在所有应用规则与国内兜底之后、gfw 之前）--------
  # 位置理由：上面所有应用/功能规则优先命中；CN_域/CN_IP 先直连，避免把
  # cloudflare-cn.com、cftest*.cn 这类国内 CDN 子集拉去走代理；而 gfw 是
  # 总模式，放在它之前才能让 Cloudflare 组真正接管 CF 流量。想让它连 gfw
  # 都让路，就把这两行移到 MATCH 之前（但那时 gfw 已吃掉大部分 CF 域名）。
  - RULE-SET,Cloudflare_域,Cloudflare
  - RULE-SET,Cloudflare_IP,Cloudflare,no-resolve

  # 末端兜底规则
  - RULE-SET,gfw,总模式
  - MATCH,漏网之鱼
