# ============ 规则集锚点定义 ============
rule-anchor:
  Local: &Local
    {type: file, behavior: classical, format: text}
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: 86400}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: 86400}

# ============ 规则集配置 ============
rule-providers:
  # 本地自定义规则，使用前自行创建etc文件夹和相关文件
  直连名单:
    <<: *Local
    path: ./etc/直连名单.list
  代理名单:
    <<: *Local
    path: ./etc/代理名单.list

  # cnip绕过规则
  geoip-cn:
    <<: *IPCIDR
    path: ./rule_provider/cnip.mrs
    url: "https://v6.gh-proxy.org/https://github.com/samqvz/DIY-Ruleset/raw/publish/mihomo/cn_ip.mrs"

  #gfw相关规则
  gfw:
    <<: *Domain
    path: ./rule_provider/gfw.mrs
    url: 'https://v6.gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/gfw.mrs'

  # 过滤，广告净化规则
  WebRTC_端/域:
    <<: *Domain
    path: ./rule_provider/WebRTC.mrs
    url: "https://github.com/5MayRain/rule/raw/refs/heads/main/rule/Mihomo/STUN/Domain_STUN.mrs"
  Fake-IP-Filter:
    <<: *Domain
    path: ./rule_provider/Fake-IP-Filter.mrs
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs"
  No-ads-all_域:
    <<: *Domain
    path: ./rule_provider/No-ads-all.mrs
    url: "https://v6.gh-proxy.org/https://github.com/TG-Twilight/AWAvenue-Ads-Rule/raw/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash.mrs"
  Private_域:
    <<: *Domain
    path: ./rule_provider/Private.mrs
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/private.mrs"
  Private_IP:
